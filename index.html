<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToiletGonzo | Official Page</title>
    <style>
        :root {
            --bg: #09090d;
            --card-bg: #13131a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #9496a6;
            --tg-color: #229ed9;
            --accent: #6c5ce7;
            --gap: 14px;
            --radius: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(108, 92, 231, 0.14), transparent 55%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 16px 90px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 26px;
            transition: max-width 0.3s ease;
        }
        .container.wide-layout { max-width: 1060px; }

        .block { width: 100%; }
        .align-left { text-align: left; align-items: flex-start; }
        .align-center { text-align: center; align-items: center; }
        .align-right { text-align: right; align-items: flex-end; }

        .header-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 10px 28px rgba(108, 92, 231, 0.38);
            overflow: hidden;
            margin-bottom: 4px;
            border: 2px solid rgba(255, 255, 255, 0.14);
            flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .title { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; }
        .subtitle { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 520px; }

        .button-block { display: flex; flex-direction: column; }
        .tg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #2AABEE, #1e96c8);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 34px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 8px 25px rgba(34, 158, 217, 0.42);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .tg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(34, 158, 217, 0.6);
            filter: brightness(1.06);
        }
        .tg-btn.full-width { width: 100%; max-width: 480px; }
        .tg-btn.pulse-btn { animation: tgPulse 2.4s infinite; }
        @keyframes tgPulse {
            0% { box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.55), 0 8px 25px rgba(34, 158, 217, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(42, 171, 238, 0), 0 8px 25px rgba(34, 158, 217, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(42, 171, 238, 0), 0 8px 25px rgba(34, 158, 217, 0.4); }
        }

        .floating-tg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 95;
            width: calc(100% - 32px);
            max-width: 420px;
        }
        .floating-tg .tg-btn { width: 100%; }

        .gallery-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            transition: transform 0.25s ease, border-color 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .gallery-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.24);
        }
        .gallery-card .img-wrap {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: #0d0d12;
        }
        .gallery-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.35s ease;
        }
        .gallery-card:hover img { transform: scale(1.03); }
        .gallery-caption {
            padding: 10px 14px;
            font-size: 13.5px;
            color: #d6d8e4;
            text-align: center;
            background: rgba(18, 18, 26, 0.95);
            border-top: 1px solid var(--border);
        }

        .ratio-9-16 .img-wrap { aspect-ratio: 9 / 16; }
        .ratio-3-4 .img-wrap  { aspect-ratio: 3 / 4; }
        .ratio-1-1 .img-wrap  { aspect-ratio: 1 / 1; }
        .ratio-16-9 .img-wrap { aspect-ratio: 16 / 9; }
        .ratio-auto .img-wrap { aspect-ratio: auto; }
        .ratio-auto .img-wrap img { height: auto; object-fit: contain; }

        .gallery-grid {
            display: grid;
            gap: var(--gap);
            width: 100%;
            align-items: start;
        }
        .gallery-grid.cols-1 { grid-template-columns: 1fr; }
        .gallery-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .gallery-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .gallery-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

        .gallery-masonry {
            column-gap: var(--gap);
            width: 100%;
        }
        .gallery-masonry.cols-1 { column-count: 1; }
        .gallery-masonry.cols-2 { column-count: 2; }
        .gallery-masonry.cols-3 { column-count: 3; }
        .gallery-masonry.cols-4 { column-count: 4; }
        .gallery-masonry .gallery-card {
            break-inside: avoid;
            margin-bottom: var(--gap);
            display: inline-block;
            width: 100%;
        }
        .gallery-masonry .img-wrap { aspect-ratio: auto !important; }
        .gallery-masonry .img-wrap img { height: auto; object-fit: cover; }

        .v-carousel-wrap {
            display: grid;
            gap: var(--gap);
            width: 100%;
            height: 640px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
        }
        .v-carousel-wrap.cols-1 { grid-template-columns: 1fr; }
        .v-carousel-wrap.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .v-carousel-wrap.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .v-carousel-wrap.cols-4 { grid-template-columns: repeat(4, 1fr); }

        .v-col { overflow: hidden; position: relative; height: 100%; }
        .v-track {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            padding-bottom: var(--gap);
            will-change: transform;
        }
        .v-carousel-wrap:hover .v-track { animation-play-state: paused !important; }

        @keyframes scrollDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0%); }
        }
        @keyframes scrollUp {
            0% { transform: translateY(0%); }
            100% { transform: translateY(-50%); }
        }

        .h-carousel-wrap {
            width: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
        }
        .h-row {
            display: flex;
            width: max-content;
            gap: var(--gap);
            will-change: transform;
        }
        .h-carousel-wrap:hover .h-row { animation-play-state: paused !important; }
        .h-row .gallery-card { width: 260px; flex-shrink: 0; }

        @keyframes scrollLeft {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        @keyframes scrollRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }

        @media (max-width: 768px) {
            .gallery-grid.cols-3, .gallery-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
            .gallery-masonry.cols-3, .gallery-masonry.cols-4 { column-count: 2; }
            .v-carousel-wrap.cols-3, .v-carousel-wrap.cols-4 { grid-template-columns: repeat(2, 1fr); }
            .v-carousel-wrap { height: 520px; }
            .h-row .gallery-card { width: 210px; }
        }
        @media (max-width: 480px) {
            .mobile-cols-1.gallery-grid { grid-template-columns: 1fr !important; }
            .mobile-cols-1.gallery-masonry { column-count: 1 !important; }
            .mobile-cols-1.v-carousel-wrap { grid-template-columns: 1fr !important; }
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 95vw;
            max-height: 92vh;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body>

    <div class="container" id="app"></div>
    <div id="floating-container"></div>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img id="lightbox-img" src="" alt="Preview">
    </div>

    <script>
        const DEFAULT_CONFIG = {
            title: "ToiletGonzo",
            subtitle: "Official Page & Direct Contact",
            avatarText: "TG",
            avatarImage: "",
            showAvatar: true,
            headerAlign: "center",
            buttonText: "Contact in Telegram",
            telegramUrl: "https://t.me/toiletgonzo",
            buttonAlign: "center",
            buttonWidth: "auto",
            buttonFloating: false,
            buttonPulse: true,
            displayMode: "grid",
            galleryColumns: 2,
            mobileColumns: 2,
            aspectRatio: "3-4",
            carouselDirection: "down",
            carouselSpeed: 28,
            hCarouselRows: 1,
            imageClickAction: "zoom",
            layoutOrder: ["header", "button", "gallery"],
            images: []
        };

        let activeConfig = DEFAULT_CONFIG;

        function handleImageClick(src) {
            if (activeConfig.imageClickAction === 'telegram' && activeConfig.telegramUrl) {
                window.open(activeConfig.telegramUrl, '_blank', 'noopener');
                return;
            }
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.classList.add('active');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function buildCardHtml(img) {
            const pos = img.pos || 'center';
            const safeSrc = img.src;
            const captionHtml = img.caption ? `<div class="gallery-caption">${escapeHtml(img.caption)}</div>` : '';
            return `
                <div class="gallery-card">
                    <div class="img-wrap">
                        <img src="${safeSrc}" style="object-position: ${pos};" alt="${escapeHtml(img.caption || '')}" onclick="handleImageClick('${safeSrc}')">
                    </div>
                    ${captionHtml}
                </div>
            `;
        }

        function renderSite(cfg) {
            const config = { ...DEFAULT_CONFIG, ...cfg };
            activeConfig = config;
            document.title = `${config.title || 'ToiletGonzo'} | Official Page`;

            const app = document.getElementById('app');
            const floatContainer = document.getElementById('floating-container');
            app.innerHTML = '';
            floatContainer.innerHTML = '';

            const cols = Number(config.galleryColumns) || 2;
            if (cols >= 3 || config.displayMode === 'h-carousel') {
                app.classList.add('wide-layout');
            } else {
                app.classList.remove('wide-layout');
            }

            const tgSvg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.29c-.15.68-.55.85-1.11.53l-3.08-2.27-1.49 1.43c-.16.16-.3.3-.61.3l.22-3.11 5.67-5.13c.25-.22-.05-.34-.38-.12l-7.01 4.41-3.02-.95c-.66-.21-.67-.66.14-.98l11.75-4.53c.55-.2 1.03.14.85 1.01z"/></svg>`;

            const blocks = {
                header: () => {
                    const el = document.createElement('div');
                    el.className = `block header-block align-${config.headerAlign}`;
                    let avatarHtml = '';
                    if (config.showAvatar) {
                        const inner = config.avatarImage
                            ? `<img src="${config.avatarImage}" alt="Avatar">`
                            : escapeHtml(config.avatarText || 'TG');
                        avatarHtml = `<div class="avatar">${inner}</div>`;
                    }
                    el.innerHTML = `
                        ${avatarHtml}
                        ${config.title ? `<h1 class="title">${escapeHtml(config.title)}</h1>` : ''}
                        ${config.subtitle ? `<p class="subtitle">${escapeHtml(config.subtitle)}</p>` : ''}
                    `;
                    return el;
                },
                button: () => {
                    const classes = [
                        'tg-btn',
                        config.buttonWidth === 'full' ? 'full-width' : '',
                        config.buttonPulse ? 'pulse-btn' : ''
                    ].filter(Boolean).join(' ');

                    const btnHtml = `
                        <a href="${escapeHtml(config.telegramUrl)}" target="_blank" rel="noopener noreferrer" class="${classes}">
                            ${tgSvg}
                            <span>${escapeHtml(config.buttonText || 'Contact in Telegram')}</span>
                        </a>
                    `;
                    if (config.buttonFloating) {
                        floatContainer.innerHTML = `<div class="floating-tg">${btnHtml}</div>`;
                        return null;
                    }
                    const el = document.createElement('div');
                    el.className = `block button-block align-${config.buttonAlign}`;
                    el.innerHTML = btnHtml;
                    return el;
                },
                gallery: () => {
                    const imgs = config.images || [];
                    if (!imgs.length) return null;

                    const mode = config.displayMode || 'grid';
                    const ratioClass = `ratio-${config.aspectRatio || '3-4'}`;
                    const mobClass = Number(config.mobileColumns) === 1 ? 'mobile-cols-1' : '';
                    const speed = Math.max(8, Number(config.carouselSpeed) || 28);

                    if (mode === 'masonry') {
                        const el = document.createElement('div');
                        el.className = `block gallery-masonry cols-${cols} ${mobClass}`;
                        el.innerHTML = imgs.map(buildCardHtml).join('');
                        return el;
                    }

                    if (mode === 'v-carousel') {
                        const el = document.createElement('div');
                        el.className = `block v-carousel-wrap cols-${cols} ${ratioClass} ${mobClass}`;
                        let colsHtml = '';
                        for (let c = 0; c < cols; c++) {
                            let colImgs = imgs.filter((_, idx) => idx % cols === c);
                            if (!colImgs.length) colImgs = imgs.map((_, idx) => imgs[(idx + c) % imgs.length]);
                            let baseSet = [...colImgs];
                            while (baseSet.length < 4) baseSet = baseSet.concat(colImgs);
                            const loopSet = [...baseSet, ...baseSet];

                            let animName = 'scrollDown';
                            if (config.carouselDirection === 'up') animName = 'scrollUp';
                            else if (config.carouselDirection === 'alt') animName = (c % 2 === 0) ? 'scrollDown' : 'scrollUp';

                            const colSpeed = speed + (c % 2) * 3;
                            colsHtml += `
                                <div class="v-col">
                                    <div class="v-track" style="animation: ${animName} ${colSpeed}s linear infinite;">
                                        ${loopSet.map(buildCardHtml).join('')}
                                    </div>
                                </div>
                            `;
                        }
                        el.innerHTML = colsHtml;
                        return el;
                    }

                    if (mode === 'h-carousel') {
                        const el = document.createElement('div');
                        el.className = `block h-carousel-wrap ${ratioClass}`;
                        const rows = Number(config.hCarouselRows) || 1;
                        let rowsHtml = '';

                        for (let r = 0; r < rows; r++) {
                            let rowImgs = rows > 1 ? imgs.filter((_, idx) => idx % rows === r) : [...imgs];
                            if (!rowImgs.length) rowImgs = [...imgs];
                            let baseSet = [...rowImgs];
                            while (baseSet.length < 6) baseSet = baseSet.concat(rowImgs);
                            const loopSet = [...baseSet, ...baseSet];

                            let animName = 'scrollLeft';
                            if (config.carouselDirection === 'right' || config.carouselDirection === 'down') animName = 'scrollRight';
                            else if (config.carouselDirection === 'alt') animName = (r % 2 === 0) ? 'scrollLeft' : 'scrollRight';

                            rowsHtml += `
                                <div class="h-row" style="animation: ${animName} ${speed + r * 4}s linear infinite;">
                                    ${loopSet.map(buildCardHtml).join('')}
                                </div>
                            `;
                        }
                        el.innerHTML = rowsHtml;
                        return el;
                    }

                    const el = document.createElement('div');
                    el.className = `block gallery-grid cols-${cols} ${ratioClass} ${mobClass}`;
                    el.innerHTML = imgs.map(buildCardHtml).join('');
                    return el;
                }
            };

            (config.layoutOrder || ["header", "button", "gallery"]).forEach(key => {
                if (blocks[key]) {
                    const node = blocks[key]();
                    if (node) app.appendChild(node);
                }
            });
        }

        async function init() {
            const localCache = localStorage.getItem('tg_site_preview_cache');
            if (localCache) {
                try { renderSite(JSON.parse(localCache)); } catch (e) {}
            } else {
                renderSite(DEFAULT_CONFIG);
            }

            try {
                const res = await fetch(`./data.json?v=${Date.now()}`, { cache: "no-store" });
                if (res.ok) {
                    const serverData = await res.json();
                    renderSite(serverData);
                    localStorage.removeItem('tg_site_preview_cache');
                }
            } catch (err) {}
        }

        init();
    </script>
</body>
</html>
