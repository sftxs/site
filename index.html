<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToiletGonzo | Official Page</title>
    <style>
        :root {
            --bg: #0b0b0e;
            --card-bg: #141419;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #9496a1;
            --tg-color: #229ed9;
            --accent: #6c5ce7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(108, 92, 231, 0.12), transparent 60%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px 80px;
        }
        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .block {
            width: 100%;
            transition: all 0.25s ease;
        }
        .align-left { text-align: left; align-items: flex-start; }
        .align-center { text-align: center; align-items: center; }
        .align-right { text-align: right; align-items: flex-end; }

        /* Profile Header */
        .header-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
        }
        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
            overflow: hidden;
            margin-bottom: 6px;
            border: 2px solid rgba(255, 255, 255, 0.12);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
            max-width: 480px;
        }

        /* Telegram Button */
        .button-block {
            display: flex;
            flex-direction: column;
        }
        .tg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 8px 24px rgba(34, 158, 217, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
        }
        .tg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(34, 158, 217, 0.55);
            filter: brightness(1.05);
        }
        .tg-btn:active { transform: translateY(0); }
        .tg-btn.full-width { width: 100%; }

        /* Floating Button Mode */
        .floating-tg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            width: calc(100% - 32px);
            max-width: 420px;
        }
        .floating-tg .tg-btn { width: 100%; }

        /* Images Gallery Block */
        .gallery-grid {
            display: grid;
            gap: 16px;
            width: 100%;
        }
        .gallery-grid.cols-1 { grid-template-columns: 1fr; }
        .gallery-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        @media (max-width: 520px) {
            .gallery-grid.cols-2 { grid-template-columns: 1fr; }
        }
        .gallery-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }
        .gallery-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .gallery-card img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
            max-height: 540px;
            object-fit: cover;
        }
        .gallery-caption {
            padding: 12px 16px;
            font-size: 14px;
            color: #d1d3df;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        /* Lightbox for full-size image viewing */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 95vw;
            max-height: 92vh;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="container" id="app"></div>
    <div id="floating-container"></div>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img id="lightbox-img" src="" alt="Preview">
    </div>

    <script>
        const DEFAULT_CONFIG = {
            title: "ToiletGonzo",
            subtitle: "Official Page & Direct Contact",
            avatarText: "TG",
            avatarImage: "",
            showAvatar: true,
            headerAlign: "center",
            buttonText: "Contact in Telegram",
            telegramUrl: "https://t.me/toiletgonzo",
            buttonAlign: "center",
            buttonWidth: "auto",
            buttonFloating: false,
            galleryColumns: 1,
            layoutOrder: ["header", "gallery", "button"],
            images: []
        };

        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.classList.add('active');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function renderSite(cfg) {
            const config = { ...DEFAULT_CONFIG, ...cfg };
            document.title = `${config.title} | Official Page`;

            const app = document.getElementById('app');
            const floatContainer = document.getElementById('floating-container');
            app.innerHTML = '';
            floatContainer.innerHTML = '';

            const tgSvg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.29c-.15.68-.55.85-1.11.53l-3.08-2.27-1.49 1.43c-.16.16-.3.3-.61.3l.22-3.11 5.67-5.13c.25-.22-.05-.34-.38-.12l-7.01 4.41-3.02-.95c-.66-.21-.67-.66.14-.98l11.75-4.53c.55-.2 1.03.14.85 1.01z"/></svg>`;

            const blocks = {
                header: () => {
                    const el = document.createElement('div');
                    el.className = `block header-block align-${config.headerAlign}`;
                    let avatarHtml = '';
                    if (config.showAvatar) {
                        const inner = config.avatarImage
                            ? `<img src="${config.avatarImage}" alt="Avatar">`
                            : escapeHtml(config.avatarText || 'TG');
                        avatarHtml = `<div class="avatar">${inner}</div>`;
                    }
                    el.innerHTML = `
                        ${avatarHtml}
                        ${config.title ? `<h1 class="title">${escapeHtml(config.title)}</h1>` : ''}
                        ${config.subtitle ? `<p class="subtitle">${escapeHtml(config.subtitle)}</p>` : ''}
                    `;
                    return el;
                },
                button: () => {
                    const btnHtml = `
                        <a href="${escapeHtml(config.telegramUrl)}" target="_blank" rel="noopener noreferrer" class="tg-btn ${config.buttonWidth === 'full' ? 'full-width' : ''}">
                            ${tgSvg}
                            <span>${escapeHtml(config.buttonText || 'Contact in Telegram')}</span>
                        </a>
                    `;
                    if (config.buttonFloating) {
                        floatContainer.innerHTML = `<div class="floating-tg">${btnHtml}</div>`;
                        return null;
                    }
                    const el = document.createElement('div');
                    el.className = `block button-block align-${config.buttonAlign}`;
                    el.innerHTML = btnHtml;
                    return el;
                },
                gallery: () => {
                    if (!config.images || config.images.length === 0) return null;
                    const el = document.createElement('div');
                    el.className = `block gallery-grid cols-${config.galleryColumns || 1}`;
                    el.innerHTML = config.images.map(img => `
                        <div class="gallery-card">
                            <img src="${img.src}" alt="${escapeHtml(img.caption || '')}" onclick="openLightbox('${img.src}')">
                            ${img.caption ? `<div class="gallery-caption">${escapeHtml(img.caption)}</div>` : ''}
                        </div>
                    `).join('');
                    return el;
                }
            };

            (config.layoutOrder || ["header", "gallery", "button"]).forEach(key => {
                if (blocks[key]) {
                    const node = blocks[key]();
                    if (node) app.appendChild(node);
                }
            });
        }

        async function init() {
            // Instant local preview if admin just saved from this browser
            const localCache = localStorage.getItem('tg_site_preview_cache');
            if (localCache) {
                try { renderSite(JSON.parse(localCache)); } catch (e) {}
            } else {
                renderSite(DEFAULT_CONFIG);
            }

            // Fetch live data.json from server
            try {
                const res = await fetch(`./data.json?v=${Date.now()}`, { cache: "no-store" });
                if (res.ok) {
                    const serverData = await res.json();
                    renderSite(serverData);
                    localStorage.removeItem('tg_site_preview_cache');
                }
            } catch (err) {
                // Uses default or cached config if data.json is not created yet
            }
        }

        init();
    </script>
</body>
</html>
