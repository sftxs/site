<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToiletGonzo | Official Page</title>
    <!-- Мгновенный логотип сайта (Favicon) во вкладке браузера -->
    <link rel="icon" id="site-favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236c5ce7'/%3E%3Cstop offset='100%25' stop-color='%23229ed9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='url(%23g)'/%3E%3Ctext x='50' y='64' font-family='Arial,sans-serif' font-size='42' font-weight='900' fill='%23ffffff' text-anchor='middle'%3ETG%3C/text%3E%3C/svg%3E">
    <!-- Предзагрузка данных с CDN для максимальной скорости -->
    <link rel="preload" href="./data-fast.json" as="fetch" crossorigin="anonymous">
    <style>
        :root {
            --bg: #09090d;
            --card-bg: #13131a;
            --border: rgba(255, 255, 255, 0.09);
            --text: #ffffff;
            --muted: #9496a6;
            --tg-color: #229ed9;
            --accent: #6c5ce7;
            --gap: 16px;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(108, 92, 231, 0.14), transparent 55%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 16px 90px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .block { width: 100%; }
        .align-left { text-align: left; align-items: flex-start; }
        .align-center { text-align: center; align-items: center; }
        .align-right { text-align: right; align-items: flex-end; }

        /* Header */
        .header-block { display: flex; flex-direction: column; gap: 10px; }
        .avatar {
            width: 92px; height: 92px; border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 800;
            box-shadow: 0 10px 28px rgba(108, 92, 231, 0.38);
            overflow: hidden; margin-bottom: 4px;
            border: 2px solid rgba(255, 255, 255, 0.14); flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .title { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; }
        .subtitle { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 520px; }

        /* Telegram Button */
        .button-block { display: flex; flex-direction: column; }
        .tg-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            background: linear-gradient(135deg, #2AABEE, #1e96c8);
            color: #ffffff; text-decoration: none; padding: 16px 34px; border-radius: 16px;
            font-weight: 700; font-size: 17px;
            box-shadow: 0 8px 25px rgba(34, 158, 217, 0.42);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer;
        }
        .tg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(34, 158, 217, 0.6);
            filter: brightness(1.06);
        }
        .tg-btn.full-width { width: 100%; max-width: 480px; }
        .tg-btn.pulse-btn { animation: tgPulse 2.4s infinite; }
        @keyframes tgPulse {
            0% { box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.55), 0 8px 25px rgba(34, 158, 217, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(42, 171, 238, 0), 0 8px 25px rgba(34, 158, 217, 0.4); }
            100% { box-shadow: 0 0 0 0 rgba(42, 171, 238, 0), 0 8px 25px rgba(34, 158, 217, 0.4); }
        }
        .floating-tg {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 95; width: calc(100% - 32px); max-width: 420px;
        }
        .floating-tg .tg-btn { width: 100%; }

        /* Instant Skeleton Shimmer while loading on slow connections */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--gap);
            width: 100%;
        }
        .skeleton-card {
            height: 360px;
            border-radius: var(--radius);
            background: linear-gradient(110deg, #13131a 8%, #1e1e2a 18%, #13131a 33%);
            background-size: 200% 100%;
            animation: shimmer 1.3s linear infinite;
            border: 1px solid var(--border);
        }
        @keyframes shimmer {
            to { background-position-x: -200%; }
        }
        @media (max-width: 600px) {
            .skeleton-card { height: 240px; }
        }

        /* Card Shared */
        .gallery-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
            transition: transform 0.25s ease, border-color 0.25s ease;
            position: relative;
        }
        .gallery-card:hover { border-color: rgba(255, 255, 255, 0.26); }
        .gallery-card .img-wrap {
            width: 100%; position: relative; overflow: hidden; line-height: 0;
            cursor: pointer; background: #101017;
        }
        .gallery-card img.main-photo {
            width: 100%; height: auto; display: block;
            user-select: none; -webkit-user-drag: none;
            animation: fadeInImg 0.25s ease;
        }
        @keyframes fadeInImg {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        .gallery-caption {
            padding: 10px 14px; font-size: 13.5px; color: #d6d8e4;
            text-align: center; background: rgba(18, 18, 26, 0.96);
            border-top: 1px solid var(--border); line-height: 1.4;
        }

        /* Watermark Overlay */
        .wm-live {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 12;
            white-space: nowrap;
            font-weight: 900;
            line-height: 1;
            user-select: none;
        }
        .wm-live.style-outline {
            text-shadow:
                -1.5px -1.5px 0 rgba(0,0,0,0.92),
                 1.5px -1.5px 0 rgba(0,0,0,0.92),
                -1.5px  1.5px 0 rgba(0,0,0,0.92),
                 1.5px  1.5px 0 rgba(0,0,0,0.92),
                 0px 2px 6px rgba(0,0,0,0.85);
        }
        .wm-live.style-pill {
            background: rgba(0, 0, 0, 0.7);
            padding: 0.35em 0.65em;
            border-radius: 0.45em;
        }
        .wm-live.style-shadow {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.95);
        }

        /* 1. FREEFORM 1:1 CANVAS STAGE */
        .free-canvas-stage { position: relative; width: 100%; min-height: 100px; }
        .free-canvas-item { position: absolute; transform-origin: top left; }
        .free-canvas-item:hover { z-index: 50 !important; }

        /* 2. SMART FLEX FLOW */
        .smart-flow-wrap {
            display: flex; flex-wrap: wrap; gap: var(--gap);
            width: 100%; justify-content: center; align-items: flex-start;
        }
        .smart-flow-item { flex: 0 0 auto; transition: transform 0.25s ease; }
        .smart-flow-item:hover { transform: translateY(-3px); }

        @media (max-width: 600px) {
            .mobile-stack .free-canvas-stage {
                height: auto !important; display: flex; flex-direction: column; gap: 14px;
            }
            .mobile-stack .free-canvas-item {
                position: relative !important; left: 0 !important; top: 0 !important; width: 100% !important;
            }
            .mobile-stack .smart-flow-item { width: 100% !important; }
        }

        /* 3. VERTICAL & HORIZONTAL CAROUSELS */
        .v-carousel-wrap {
            display: grid; gap: var(--gap); width: 100%; height: 680px;
            overflow: hidden; position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, black 6%, black 94%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 6%, black 94%, transparent 100%);
        }
        .v-carousel-wrap.cols-1 { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; }
        .v-carousel-wrap.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .v-carousel-wrap.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .v-carousel-wrap.cols-4 { grid-template-columns: repeat(4, 1fr); }
        .v-col { overflow: hidden; position: relative; height: 100%; }
        .v-track {
            display: flex; flex-direction: column; gap: var(--gap);
            padding-bottom: var(--gap); will-change: transform;
        }
        .v-carousel-wrap:hover .v-track { animation-play-state: paused !important; }
        @keyframes scrollDown { 0% { transform: translateY(-50%); } 100% { transform: translateY(0%); } }
        @keyframes scrollUp { 0% { transform: translateY(0%); } 100% { transform: translateY(-50%); } }

        .h-carousel-wrap {
            width: 100%; overflow: hidden; position: relative;
            display: flex; flex-direction: column; gap: var(--gap);
            mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
        }
        .h-row {
            display: flex; width: max-content; gap: var(--gap);
            align-items: center; will-change: transform;
        }
        .h-carousel-wrap:hover .h-row { animation-play-state: paused !important; }
        .h-row .gallery-card { width: 280px; flex-shrink: 0; }
        @keyframes scrollLeft { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        @keyframes scrollRight { 0% { transform: translateX(-50%); } 100% { transform: translateX(0%); } }

        @media (max-width: 768px) {
            .v-carousel-wrap.cols-3, .v-carousel-wrap.cols-4 { grid-template-columns: repeat(2, 1fr); }
            .v-carousel-wrap { height: 520px; }
            .h-row .gallery-card { width: 220px; }
        }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px); display: none;
            align-items: center; justify-content: center; z-index: 999; padding: 20px; cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox-inner {
            position: relative;
            display: inline-block;
            line-height: 0;
            max-width: 95vw;
            max-height: 92vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.85);
        }
        .lightbox-inner img.lightbox-main {
            max-width: 95vw;
            max-height: 92vh;
            width: auto;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body oncontextmenu="if(event.target.tagName==='IMG') return false;">

    <div class="container" id="app"></div>
    <div id="floating-container"></div>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <div class="lightbox-inner" id="lightbox-inner">
            <img class="lightbox-main" id="lightbox-img" src="" alt="Preview" onload="updateWatermarkFontSizes()">
            <div id="lightbox-wm"></div>
        </div>
    </div>

    <script>
        const DEFAULT_WATERMARK = {
            enabled: true,
            type: "text",
            text: "toiletgonzo.vip",
            logoSrc: "",
            size: 24,
            opacity: 0.85,
            color: "#ffffff",
            style: "outline",
            angle: 0,
            defaultX: 50,
            defaultY: 88
        };

        const DEFAULT_CONFIG = {
            title: "ToiletGonzo",
            subtitle: "Official Page & Direct Contact",
            avatarText: "TG",
            avatarImage: "",
            showAvatar: true,
            headerAlign: "center",
            buttonText: "Contact in Telegram",
            telegramUrl: "https://t.me/toiletgonzo",
            buttonAlign: "center",
            buttonWidth: "auto",
            buttonFloating: false,
            buttonPulse: true,
            displayMode: "canvas",
            mobileMode: "exact",
            galleryColumns: 2,
            carouselDirection: "down",
            carouselSpeed: 28,
            hCarouselRows: 1,
            imageClickAction: "zoom",
            layoutOrder: ["header", "button", "gallery"],
            watermark: DEFAULT_WATERMARK,
            images: []
        };

        let activeConfig = DEFAULT_CONFIG;
        let cachedLogoImg = null;
        let currentLightboxIdx = null;
        let isDataLoaded = false;

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function updateFavicon(cfg) {
            const link = document.getElementById('site-favicon');
            if (!link) return;
            if (cfg.avatarImage) {
                link.type = "image/webp";
                link.href = cfg.avatarImage;
            } else {
                const txt = escapeHtml((cfg.avatarText || 'TG').slice(0, 3));
                link.type = "image/svg+xml";
                link.href = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236c5ce7'/%3E%3Cstop offset='100%25' stop-color='%23229ed9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='url(%23g)'/%3E%3Ctext x='50' y='64' font-family='Arial,sans-serif' font-size='42' font-weight='900' fill='%23ffffff' text-anchor='middle'%3E${ encodeURIComponent(txt) }%3C/text%3E%3C/svg%3E`;
            }
        }

        function buildWatermarkOverlayHtml(img, gWm) {
            if (img._isBaked) return '';
            const wm = img.wm || {};
            const isEnabled = wm.enabled !== undefined ? wm.enabled : gWm.enabled;
            if (!isEnabled) return '';

            const x = wm.x !== undefined ? wm.x : (gWm.defaultX ?? 50);
            const y = wm.y !== undefined ? wm.y : (gWm.defaultY ?? 88);
            const sizePct = wm.size || gWm.size || 24;
            const opacity = wm.opacity ?? gWm.opacity ?? 0.85;
            const angle = wm.angle ?? gWm.angle ?? 0;

            if (gWm.type === 'image' && gWm.logoSrc) {
                return `
                    <img class="wm-live" src="${gWm.logoSrc}"
                         style="left:${x}%; top:${y}%; width:${sizePct}%; opacity:${opacity}; transform: translate(-50%, -50%) rotate(${angle}deg);">
                `;
            }

            const text = (wm.customText !== undefined && wm.customText !== '') ? wm.customText : (gWm.text || '');
            if (!text.trim()) return '';

            return `
                <div class="wm-live style-${gWm.style || 'outline'}"
                     data-size="${sizePct}"
                     style="left:${x}%; top:${y}%; color:${gWm.color || '#ffffff'}; opacity:${opacity}; transform: translate(-50%, -50%) rotate(${angle}deg);">
                    ${escapeHtml(text)}
                </div>
            `;
        }

        // Bake watermark into pixels only on demand (Lightbox open), keeping page load 100% lag-free
        async function bakeWatermarkToDataUrl(imgObj, globalWm) {
            if (imgObj._bakedSrc) return imgObj._bakedSrc;
            const wm = imgObj.wm || {};
            const isEnabled = wm.enabled !== undefined ? wm.enabled : globalWm.enabled;
            if (!isEnabled) return imgObj.src;

            const type = globalWm.type || 'text';
            const text = (wm.customText !== undefined && wm.customText !== '') ? wm.customText : (globalWm.text || '');
            if (type === 'text' && !text.trim()) return imgObj.src;
            if (type === 'image' && !globalWm.logoSrc) return imgObj.src;

            return new Promise((resolve) => {
                const baseImg = new Image();
                baseImg.crossOrigin = "anonymous";
                baseImg.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const w = baseImg.naturalWidth || baseImg.width;
                    const h = baseImg.naturalHeight || baseImg.height;
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(baseImg, 0, 0, w, h);

                    const xPct = wm.x !== undefined ? Number(wm.x) : Number(globalWm.defaultX ?? 50);
                    const yPct = wm.y !== undefined ? Number(wm.y) : Number(globalWm.defaultY ?? 88);
                    const sizePct = Number(wm.size || globalWm.size || 24);
                    const opacity = Number(wm.opacity ?? globalWm.opacity ?? 0.85);
                    const angle = Number(wm.angle ?? globalWm.angle ?? 0);

                    const cx = (xPct / 100) * w;
                    const cy = (yPct / 100) * h;

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate((angle * Math.PI) / 180);
                    ctx.globalAlpha = Math.max(0.05, Math.min(1, opacity));

                    if (type === 'image' && globalWm.logoSrc) {
                        if (!cachedLogoImg || cachedLogoImg.dataset.src !== globalWm.logoSrc) {
                            cachedLogoImg = new Image();
                            cachedLogoImg.dataset.src = globalWm.logoSrc;
                            await new Promise(r => { cachedLogoImg.onload = r; cachedLogoImg.onerror = r; cachedLogoImg.src = globalWm.logoSrc; });
                        }
                        if (cachedLogoImg.width > 0) {
                            const targetW = w * (sizePct / 100);
                            const targetH = targetW * (cachedLogoImg.height / cachedLogoImg.width);
                            ctx.drawImage(cachedLogoImg, -targetW / 2, -targetH / 2, targetW, targetH);
                        }
                    } else {
                        const fontSize = Math.max(12, Math.round(w * (sizePct / 100) * 0.16));
                        ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        const styleMode = globalWm.style || 'outline';
                        if (styleMode === 'pill') {
                            const metrics = ctx.measureText(text);
                            const padX = fontSize * 0.65;
                            const padY = fontSize * 0.38;
                            const boxW = metrics.width + padX * 2;
                            const boxH = fontSize + padY * 2;
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                            ctx.beginPath();
                            if (ctx.roundRect) ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, fontSize * 0.45);
                            else ctx.rect(-boxW / 2, -boxH / 2, boxW, boxH);
                            ctx.fill();
                        } else if (styleMode === 'outline') {
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                            ctx.shadowBlur = Math.max(4, fontSize * 0.2);
                            ctx.lineWidth = Math.max(2, fontSize * 0.14);
                            ctx.strokeStyle = 'rgba(0, 0, 0, 0.92)';
                            ctx.lineJoin = 'round';
                            ctx.strokeText(text, 0, 0);
                        } else if (styleMode === 'shadow') {
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                            ctx.shadowBlur = Math.max(6, fontSize * 0.3);
                            ctx.shadowOffsetX = 2;
                            ctx.shadowOffsetY = 2;
                        }

                        ctx.fillStyle = globalWm.color || '#ffffff';
                        ctx.fillText(text, 0, 0);
                    }

                    ctx.restore();
                    try {
                        const out = canvas.toDataURL('image/webp', 0.92);
                        imgObj._bakedSrc = out;
                        imgObj._isBaked = true;
                        resolve(out);
                    } catch (e) {
                        resolve(imgObj.src);
                    }
                };
                baseImg.onerror = () => resolve(imgObj.src);
                baseImg.src = imgObj.src;
            });
        }

        async function handleImageClick(idx) {
            if (activeConfig.imageClickAction === 'telegram' && activeConfig.telegramUrl) {
                window.open(activeConfig.telegramUrl, '_blank', 'noopener');
                return;
            }
            const imgObj = activeConfig.images[idx];
            if (!imgObj) return;

            currentLightboxIdx = idx;
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            const lbWm = document.getElementById('lightbox-wm');

            if (imgObj._isBaked && imgObj._bakedSrc) {
                lbImg.src = imgObj._bakedSrc;
                lbWm.innerHTML = '';
            } else {
                lbImg.src = imgObj.src;
                lbWm.innerHTML = buildWatermarkOverlayHtml(imgObj, activeConfig.watermark);
                bakeWatermarkToDataUrl(imgObj, activeConfig.watermark).then((bakedUrl) => {
                    if (currentLightboxIdx === idx && imgObj._isBaked) {
                        lbImg.src = bakedUrl;
                        lbWm.innerHTML = '';
                    }
                });
            }

            lb.classList.add('active');
            setTimeout(updateWatermarkFontSizes, 20);
        }

        function buildCardInnerHtml(img, idx, gWm) {
            const captionHtml = img.caption ? `<div class="gallery-caption">${escapeHtml(img.caption)}</div>` : '';
            const priorityAttr = idx < 4 ? 'fetchpriority="high"' : 'loading="lazy"';
            return `
                <div class="gallery-card">
                    <div class="img-wrap" data-wrap-idx="${idx}" onclick="handleImageClick(${idx})">
                        <img class="main-photo" data-idx="${idx}" src="${img.src}" ${priorityAttr} decoding="async" alt="${escapeHtml(img.caption || '')}" onload="onSiteImgLoad()">
                        <div class="card-wm-layer" data-wm-idx="${idx}">${buildWatermarkOverlayHtml(img, gWm)}</div>
                    </div>
                    ${captionHtml}
                </div>
            `;
        }

        function updateWatermarkFontSizes() {
            document.querySelectorAll('.img-wrap, #lightbox-inner').forEach(wrap => {
                const w = wrap.clientWidth || 300;
                wrap.querySelectorAll('.wm-live[data-size]').forEach(el => {
                    const sizePct = parseFloat(el.dataset.size) || 24;
                    const px = Math.max(10, Math.round(w * (sizePct / 100) * 0.16));
                    el.style.fontSize = `${px}px`;
                });
            });
        }

        function updateFreeCanvasScale() {
            const stage = document.getElementById('freeCanvasStage');
            if (stage) {
                const stageW = stage.clientWidth || 1000;
                const scale = stageW / 1000;
                let maxBottom = 120;

                stage.querySelectorAll('.free-canvas-item').forEach(item => {
                    const rawY = parseFloat(item.dataset.y) || 0;
                    const topPx = rawY * scale;
                    item.style.top = `${topPx}px`;
                    const h = item.offsetHeight || 200;
                    if (topPx + h > maxBottom) maxBottom = topPx + h;
                });

                stage.style.height = `${Math.ceil(maxBottom + 20)}px`;
            }
            updateWatermarkFontSizes();
        }

        function onSiteImgLoad() {
            updateFreeCanvasScale();
        }

        window.addEventListener('resize', updateFreeCanvasScale);

        function renderSite(cfg, showLoadingSkeleton = false) {
            const config = {
                ...DEFAULT_CONFIG,
                ...cfg,
                watermark: { ...DEFAULT_WATERMARK, ...(cfg.watermark || {}) }
            };
            activeConfig = config;
            document.title = `${config.title || 'ToiletGonzo'} | Official Page`;
            updateFavicon(config);

            const app = document.getElementById('app');
            const floatContainer = document.getElementById('floating-container');
            app.innerHTML = '';
            floatContainer.innerHTML = '';

            if (config.mobileMode === 'stack') {
                app.classList.add('mobile-stack');
            } else {
                app.classList.remove('mobile-stack');
            }

            const tgSvg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.29c-.15.68-.55.85-1.11.53l-3.08-2.27-1.49 1.43c-.16.16-.3.3-.61.3l.22-3.11 5.67-5.13c.25-.22-.05-.34-.38-.12l-7.01 4.41-3.02-.95c-.66-.21-.67-.66.14-.98l11.75-4.53c.55-.2 1.03.14.85 1.01z"/></svg>`;

            const blocks = {
                header: () => {
                    const el = document.createElement('div');
                    el.className = `block header-block align-${config.headerAlign}`;
                    let avatarHtml = '';
                    if (config.showAvatar) {
                        const inner = config.avatarImage
                            ? `<img src="${config.avatarImage}" alt="Avatar">`
                            : escapeHtml(config.avatarText || 'TG');
                        avatarHtml = `<div class="avatar">${inner}</div>`;
                    }
                    el.innerHTML = `
                        ${avatarHtml}
                        ${config.title ? `<h1 class="title">${escapeHtml(config.title)}</h1>` : ''}
                        ${config.subtitle ? `<p class="subtitle">${escapeHtml(config.subtitle)}</p>` : ''}
                    `;
                    return el;
                },
                button: () => {
                    const classes = [
                        'tg-btn',
                        config.buttonWidth === 'full' ? 'full-width' : '',
                        config.buttonPulse ? 'pulse-btn' : ''
                    ].filter(Boolean).join(' ');

                    const btnHtml = `
                        <a href="${escapeHtml(config.telegramUrl)}" target="_blank" rel="noopener noreferrer" class="${classes}">
                            ${tgSvg}
                            <span>${escapeHtml(config.buttonText || 'Contact in Telegram')}</span>
                        </a>
                    `;
                    if (config.buttonFloating) {
                        floatContainer.innerHTML = `<div class="floating-tg">${btnHtml}</div>`;
                        return null;
                    }
                    const el = document.createElement('div');
                    el.className = `block button-block align-${config.buttonAlign}`;
                    el.innerHTML = btnHtml;
                    return el;
                },
                gallery: () => {
                    const imgs = config.images || [];
                    if (!imgs.length) {
                        if (showLoadingSkeleton) {
                            const skel = document.createElement('div');
                            skel.className = 'block skeleton-grid';
                            skel.innerHTML = `<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>`;
                            return skel;
                        }
                        return null;
                    }

                    const mode = config.displayMode || 'canvas';
                    const cols = Number(config.galleryColumns) || 2;
                    const speed = Math.max(8, Number(config.carouselSpeed) || 28);

                    if (mode === 'canvas') {
                        const el = document.createElement('div');
                        el.className = 'block free-canvas-stage';
                        el.id = 'freeCanvasStage';
                        el.innerHTML = imgs.map((img, i) => {
                            const x = img.x !== undefined ? img.x : ((i % 2) * 51.5);
                            const y = img.y !== undefined ? img.y : (Math.floor(i / 2) * 380);
                            const w = img.w !== undefined ? img.w : 48.5;
                            const z = img.z !== undefined ? img.z : (i + 1);
                            return `
                                <div class="free-canvas-item" data-y="${y}" style="left: ${x}%; width: ${w}%; z-index: ${z};">
                                    ${buildCardInnerHtml(img, i, config.watermark)}
                                </div>
                            `;
                        }).join('');
                        return el;
                    }

                    if (mode === 'flow' || mode === 'grid' || mode === 'masonry') {
                        const el = document.createElement('div');
                        el.className = 'block smart-flow-wrap';
                        el.innerHTML = imgs.map((img, i) => {
                            const w = img.w !== undefined ? img.w : 48.5;
                            return `
                                <div class="smart-flow-item" style="width: calc(${w}% - 12px);">
                                    ${buildCardInnerHtml(img, i, config.watermark)}
                                </div>
                            `;
                        }).join('');
                        return el;
                    }

                    if (mode === 'v-carousel') {
                        const el = document.createElement('div');
                        el.className = `block v-carousel-wrap cols-${cols}`;
                        let colsHtml = '';
                        for (let c = 0; c < cols; c++) {
                            let colImgs = imgs.map((item, idx) => ({ item, idx })).filter((_, idx) => idx % cols === c);
                            if (!colImgs.length) colImgs = imgs.map((item, idx) => ({ item, idx }));
                            let baseSet = [...colImgs];
                            while (baseSet.length < 4) baseSet = baseSet.concat(colImgs);
                            const loopSet = [...baseSet, ...baseSet];

                            let animName = 'scrollDown';
                            if (config.carouselDirection === 'up') animName = 'scrollUp';
                            else if (config.carouselDirection === 'alt') animName = (c % 2 === 0) ? 'scrollDown' : 'scrollUp';

                            const colSpeed = speed + (c % 2) * 3;
                            colsHtml += `
                                <div class="v-col">
                                    <div class="v-track" style="animation: ${animName} ${colSpeed}s linear infinite;">
                                        ${loopSet.map(entry => buildCardInnerHtml(entry.item, entry.idx, config.watermark)).join('')}
                                    </div>
                                </div>
                            `;
                        }
                        el.innerHTML = colsHtml;
                        return el;
                    }

                    if (mode === 'h-carousel') {
                        const el = document.createElement('div');
                        el.className = 'block h-carousel-wrap';
                        let rowImgs = imgs.map((item, idx) => ({ item, idx }));
                        let baseSet = [...rowImgs];
                        while (baseSet.length < 6) baseSet = baseSet.concat(rowImgs);
                        const loopSet = [...baseSet, ...baseSet];
                        const animName = (config.carouselDirection === 'right') ? 'scrollRight' : 'scrollLeft';

                        el.innerHTML = `
                            <div class="h-row" style="animation: ${animName} ${speed}s linear infinite;">
                                ${loopSet.map(entry => buildCardInnerHtml(entry.item, entry.idx, config.watermark)).join('')}
                            </div>
                        `;
                        return el;
                    }
                }
            };

            (config.layoutOrder || ["header", "button", "gallery"]).forEach(key => {
                if (blocks[key]) {
                    const node = blocks[key]();
                    if (node) app.appendChild(node);
                }
            });

            setTimeout(updateFreeCanvasScale, 40);
        }

        async function init() {
            // 1. Мгновенный показ из кэша, если посетитель уже заходил или это админ
            const adminCache = localStorage.getItem('tg_site_preview_cache');
            const visitorCache = localStorage.getItem('tg_visitor_fast_cache');

            if (adminCache) {
                try { renderSite(JSON.parse(adminCache), false); isDataLoaded = true; } catch (e) {}
            } else if (visitorCache) {
                try { renderSite(JSON.parse(visitorCache), false); isDataLoaded = true; } catch (e) {}
            } else {
                // Показываем шапку, кнопку и мерцающие карточки-скелетоны с 1-й миллисекунды
                renderSite(DEFAULT_CONFIG, true);
            }

            // 2. Сверхбыстрая загрузка первого экрана (data-fast.json с CDN-кэшированием)
            const fastPromise = fetch('./data-fast.json')
                .then(r => r.ok ? r.json() : null)
                .then(fastData => {
                    if (fastData && !isDataLoaded) {
                        renderSite(fastData, false);
                        try { localStorage.setItem('tg_visitor_fast_cache', JSON.stringify(fastData)); } catch (e) {}
                    }
                })
                .catch(() => {});

            // 3. Полная загрузка всех фотографий (data.json через глобальный CDN GitHub)
            try {
                const fullRes = await fetch('./data.json');
                if (fullRes.ok) {
                    const fullData = await fullRes.json();
                    isDataLoaded = true;
                    renderSite(fullData, false);
                    localStorage.removeItem('tg_site_preview_cache');
                    try {
                        const lightCopy = { ...fullData, images: (fullData.images || []).slice(0, 6) };
                        localStorage.setItem('tg_visitor_fast_cache', JSON.stringify(lightCopy));
                    } catch (e) {}
                } else {
                    await fastPromise;
                }
            } catch (err) {}
        }

        init();
    </script>
</body>
</html>
